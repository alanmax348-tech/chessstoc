<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chess</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1c22; --panel:#182b33; --panel2:#213a44; --line:#2f4d59;
  --text:#e8f0ec; --muted:#8fa9b0; --brass:#e2b354; --brass-ink:#2a1f05;
  --secret:#a68cff; --danger:#ff4d4d; --ok:#6fcf97;
  --bs:min(100vw, calc(100dvh - 232px));
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
.view{position:absolute;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:18px}
h1{font-size:44px;line-height:1;margin:6px 0 4px;font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;margin:0 0 12px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.btn{background:var(--panel2);border-radius:14px;padding:14px 16px;font-weight:600;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.violet{background:var(--secret);color:#1a1236}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:#5a2226}
.btn:disabled{opacity:.4}
.back{background:none;color:var(--muted);padding:6px 0;font-size:15px;text-align:left}

/* home */
.secretrow{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(100deg,#3a2f6b,#2a2350);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid #5d4fa8}
.secretrow .crown{width:44px;height:44px;flex:none}
.secretrow b{display:block;font-size:19px}
.secretrow span{font-size:14px;color:#c9bdff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border-radius:16px;padding:14px 10px;text-align:left}
.tile b{display:block;font-size:17px}.tile span{color:var(--muted);font-size:13px}
.botrow{width:100%;background:var(--panel);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.botrow small{color:var(--muted)}
.tier{width:100%;display:flex;justify-content:space-between;background:var(--panel);border-radius:14px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:600}
.tier small{color:var(--muted);font-weight:400;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin-top:14px}

/* lobby */
.lobby{align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px}
.lobby .btn{width:100%;max-width:340px}
.pulseDot{width:14px;height:14px;border-radius:50%;background:var(--brass);animation:dot 1.4s infinite}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* game */
.game{align-items:center;justify-content:space-between;overflow:hidden}
.panel{width:min(100vw,var(--bs));display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:64px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--panel2);flex:none;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:19px;overflow:hidden}
.pinfo{flex:1;min-width:0;line-height:1.2}
.pname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.puser{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.pcap{display:flex;align-items:center;height:18px;margin-top:2px}
.pcap .grp{display:flex;margin-right:4px}
.pcap img{width:16px;height:16px;margin-right:-7px}
.pcap .grp img:last-child{margin-right:0}
.pcap .diff{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;background:var(--panel);padding:6px 12px;border-radius:10px;min-width:88px;text-align:center;transition:background .2s}
.clock.on{background:var(--text);color:#0f1c22}
.clock.low{background:var(--danger);color:#fff}
.boardwrap{position:relative;width:var(--bs);height:var(--bs)}
.board{width:100%;height:100%;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
  background:url('/static/images/neoboard.png') center/100% 100% no-repeat, conic-gradient(#ecd9b3 25%,#b58863 0 50%,#ecd9b3 0 75%,#b58863 0) 0 0/25% 25%}
.sq{position:relative;display:flex}
.sq .pc{width:100%;height:100%;object-fit:contain;pointer-events:none;position:relative;z-index:2}
.sq.last::before{content:'';position:absolute;inset:0;background:rgba(255,255,0,.4);z-index:1}
.sq.sel::before{content:'';position:absolute;inset:0;background:rgba(247,247,105,.7);z-index:1}
.sq.dot::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,60,60,.75);z-index:3;pointer-events:none}
.sq.cap::after{content:'';position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(255,60,60,.85);z-index:3;pointer-events:none}
.sq.incheck::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,77,77,.75) 0%,rgba(255,77,77,.25) 55%,transparent 75%);z-index:1}
.sq.pulse::before{content:'';position:absolute;inset:0;z-index:4;background:#ff4d4d;animation:pulse .9s ease-out 2}
@keyframes pulse{0%{opacity:.95;box-shadow:0 0 0 0 #ff4d4d}70%{opacity:.15;box-shadow:0 0 16px 8px rgba(255,77,77,.6)}100%{opacity:0}}
.sq .crownb{position:absolute;top:1%;right:1%;width:34%;height:34%;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.sq.reveal .pc{animation:boom .9s cubic-bezier(.2,1.6,.4,1)}
.sq.reveal::after{content:'';position:absolute;inset:-30%;z-index:6;border-radius:50%;background:radial-gradient(circle,rgba(255,220,120,.9),rgba(255,120,60,.4) 40%,transparent 70%);animation:flash .8s ease-out forwards;pointer-events:none}
@keyframes boom{0%{transform:scale(.4) rotate(-12deg);filter:brightness(3)}60%{transform:scale(1.35)}100%{transform:scale(1);filter:none}}
@keyframes flash{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}
.coord{position:absolute;font-size:calc(var(--bs)/40);font-weight:700;opacity:.6;z-index:2;pointer-events:none;color:#222}
.coord.r{top:2px;left:3px}.coord.f{bottom:1px;right:3px}
.dragpc{position:fixed;width:calc(var(--bs)/8*1.25);height:calc(var(--bs)/8*1.25);z-index:50;pointer-events:none;transform:translate(-50%,-60%)}
.actions{width:min(100vw,var(--bs));display:flex;gap:10px;padding:6px 10px 8px}
.actions .btn{flex:1;padding:11px 8px;font-size:15px}
.spec{width:100%;text-align:center;background:var(--secret);color:#1a1236;font-weight:700;padding:8px;border-radius:10px;font-size:14px}
.offer{width:min(100vw,var(--bs));display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-radius:12px;font-size:14px}
.offer .btn{padding:8px 12px;font-size:14px}

/* modals */
.modal{position:fixed;inset:0;background:rgba(6,12,15,.78);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.card{background:var(--panel);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{margin-bottom:6px}
.banner{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.banner.win{color:var(--ok)}.banner.loss{color:#ff8a80}
.row{display:flex;gap:10px;margin-top:10px}.row .btn{flex:1}
.wide{width:100%;margin-top:14px}
.pawns{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0}
.pawnbtn{background:var(--panel2);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;position:relative;padding:2px;border:2px solid transparent}
.pawnbtn img{width:100%}
.pawnbtn i{position:absolute;bottom:-14px;font-size:11px;color:var(--muted);font-style:normal}
.pawnbtn.on{border-color:var(--secret);background:#3a2f6b}
textarea{width:100%;height:170px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px ui-monospace,monospace;resize:none}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.promo button{background:var(--panel2);border-radius:14px;aspect-ratio:1;padding:6px}.promo img{width:100%}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--text);color:#0f1c22;padding:10px 16px;border-radius:12px;font-weight:600;z-index:200;font-size:14px;max-width:88vw;text-align:center}

/* review */
.rv{padding:0 0 24px}
.rvtop{display:flex;justify-content:space-between;padding:14px 16px 4px;align-items:center}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
.acc div{background:var(--panel);border-radius:14px;padding:12px}
.acc b{font-size:30px;display:block;font-weight:800}.acc span{font-size:13px;color:var(--muted)}
.acc small{display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
.graph{margin:6px 16px;background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer;touch-action:none}
.graph svg{display:block;width:100%;height:84px}
.rvboard{--bs:min(100vw,52dvh);align-self:center;margin-top:8px}
.cur{margin:8px 16px;background:var(--panel);border-radius:14px;padding:12px;min-height:66px}
.cur b{font-size:17px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;padding:0 6px;font-size:12px;font-weight:800;color:#0b1418;margin-right:6px;vertical-align:middle}
.nav{display:flex;gap:8px;margin:0 16px 8px}.nav .btn{flex:1;padding:10px}
.moves{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.chip{background:var(--panel);border-radius:8px;padding:6px 8px;font-size:14px;display:flex;align-items:center;gap:4px}
.chip.on{outline:2px solid var(--brass)}
.chip .badge{margin:0;min-width:18px;height:18px;font-size:10px}
.loader{margin:auto;text-align:center;color:var(--muted);padding:40px}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--brass);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="view pad">
  <h1>Chess</h1>
  <p class="sub">Play a friend, a bot, or try the Secret Queen twist.</p>
  <button class="secretrow" data-mode="secret_queen">
    <svg class="crown" viewBox="0 0 24 24" fill="#e2b354"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>
    <div><b>Secret Queen 10|5</b><span>One of your pawns is secretly a queen.</span></div>
  </button>
  <div class="tiles">
    <button class="tile" data-mode="bullet"><b>Bullet</b><span>1 | 0</span></button>
    <button class="tile" data-mode="blitz"><b>Blitz</b><span>3 | 2</span></button>
    <button class="tile" data-mode="rapid"><b>Rapid</b><span>10 | 5</span></button>
  </div>
  <button class="botrow" data-mode="bot"><div><b>Play Vs Bot 10|5</b><br><small>Pick an opponent from Kid to Magnus</small></div><span>›</span></button>
  <p class="hint">To challenge a friend in any chat, type the bot's username and add a space. Or pick a time control above and share the invite link.</p>
</section>

<!-- BOT TIERS -->
<section id="bots" class="view pad hidden">
  <button class="back" id="botsBack">‹ Back</button>
  <h2>Choose your opponent</h2>
  <div id="tiers"></div>
</section>

<!-- LOBBY -->
<section id="lobby" class="view lobby hidden">
  <div class="pulseDot"></div>
  <h2 id="lobbyTitle">Waiting for an opponent</h2>
  <p class="sub" id="lobbyInfo"></p>
  <button class="btn primary" id="shareBtn">Send invitation</button>
  <button class="btn ghost" id="copyBtn">Copy link</button>
  <button class="btn danger" id="cancelBtn">Cancel invitation</button>
</section>

<!-- GAME -->
<section id="game" class="view game hidden">
  <div id="specBadge" class="spec hidden">Watching Live - Spectator Mode</div>
  <div class="panel" id="pTop"></div>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div id="offerBar" class="offer hidden"></div>
  <div class="panel" id="pBot"></div>
  <div class="actions" id="actions">
    <button class="btn" id="drawBtn">Offer draw</button>
    <button class="btn danger" id="resignBtn">Resign</button>
  </div>
</section>

<!-- REVIEW -->
<section id="review" class="view rv hidden"></section>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="hidden"></div>

<script>
'use strict';
/* ===================== helpers ===================== */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){} try{tg.setHeaderColor('#0f1c22');tg.setBackgroundColor('#0f1c22');}catch(e){} }
const $ = s => document.querySelector(s);
const IMG = '/static/images/';
const FILES = 'abcdefgh';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function initData() {
  if (tg && tg.initData) return tg.initData;
  let id = localStorage.getItem('devid'); if (!id) { id = String(Math.floor(Math.random()*1e6)+1000); localStorage.setItem('devid', id); }
  return `dev:${id}:Guest${id.slice(-3)}`;
}
async function api(path, body, method = 'POST', headers = {}) {
  const opt = { method, headers: { 'Content-Type': 'application/json', ...headers } };
  if (method === 'POST') opt.body = JSON.stringify({ init_data: initData(), ...(body || {}) });
  const r = await fetch(path, opt);
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(typeof j?.detail === 'string' ? j.detail : 'Request failed'); e.status = r.status; e.detail = j?.detail; throw e; }
  return j;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2400); }
function show(id) { for (const v of document.querySelectorAll('.view')) v.classList.toggle('hidden', v.id !== id); currentView = id; updateBackButton(); }
let currentView = 'home';
function modal(html, kind = '') { const m = $('#modal'); m.innerHTML = `<div class="card">${html}</div>`; m.dataset.kind = kind; m.classList.remove('hidden'); return m.firstChild; }
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; m.dataset.kind = ''; }

/* ===================== haptics + sound ===================== */
const H = tg && tg.HapticFeedback;
const hap = { impact: s => { try { H && H.impactOccurred(s); } catch(e){} }, notify: s => { try { H && H.notificationOccurred(s); } catch(e){} } };
let ac;
function audio() { if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
document.addEventListener('pointerdown', audio, { once: true });
function tone(f, d, type = 'sine', g = .15, slide = 0, delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, g = .2, delay = 0) {
  const a = audio(); if (!a) return; const n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), v = a.createGain(); s.buffer = b; v.gain.value = g; s.connect(v).connect(a.destination); s.start(a.currentTime + delay);
}
const snd = {
  move: () => tone(520, .07, 'triangle', .14, -180),
  capture: () => { noise(.1, .28); tone(190, .12, 'square', .09, -90); },
  check: () => { tone(880, .09, 'square', .08); tone(660, .12, 'square', .08, 0, .09); },
  error: () => { tone(150, .16, 'sawtooth', .2, -40); tone(105, .22, 'sawtooth', .2, -30, .13); },
  reveal: () => { noise(.55, .45); tone(70, .7, 'sawtooth', .28, 260); tone(520, .55, 'triangle', .18, 700, .06); tone(90, .3, 'square', .25, -50, .02); },
  over: win => { (win ? [523, 659, 784, 1047] : [392, 330, 262]).forEach((f, i) => tone(f, .28, 'triangle', .16, 0, i * .13)); },
  start: () => { tone(440, .1, 'triangle', .12); tone(660, .16, 'triangle', .12, 0, .1); }
};

/* ===================== board rendering ===================== */
function parseFen(fen) {
  const m = {}; fen.split(' ')[0].split('/').forEach((row, i) => { let f = 0; for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { m[FILES[f] + (8 - i)] = ch; f++; } } });
  return m;
}
const pimg = ch => IMG + (ch === ch.toUpperCase() ? 'w' : 'b') + ch.toLowerCase() + '.png';
const CROWN = '<svg class="crownb" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z" fill="#e2b354" stroke="#6b4a00" stroke-width="1.2"/></svg>';

function drawBoard(el, o) {
  const pcs = parseFen(o.fen); el.innerHTML = '';
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const f = o.flip ? 7 - c : c, rk = o.flip ? r : 7 - r, sq = FILES[f] + (rk + 1);
    const d = document.createElement('div'); d.className = 'sq'; d.dataset.sq = sq;
    if (o.last && (o.last[0] === sq || o.last[1] === sq)) d.classList.add('last');
    if (o.sel === sq) d.classList.add('sel');
    if (o.check === sq) d.classList.add('incheck');
    if (o.pulse === sq) d.classList.add('pulse');
    if (o.reveal === sq) d.classList.add('reveal');
    if (o.sel && o.dests && o.dests[o.sel] && o.dests[o.sel].has(sq)) {
      const mover = pcs[o.sel], ep = mover && mover.toLowerCase() === 'p' && o.sel[0] !== sq[0] && !pcs[sq];
      d.classList.add(pcs[sq] || ep ? 'cap' : 'dot');
    }
    if (pcs[sq]) { const im = document.createElement('img'); im.className = 'pc'; im.src = pimg(pcs[sq]); im.draggable = false; d.appendChild(im); }
    if (o.secret === sq && pcs[sq]) d.insertAdjacentHTML('beforeend', CROWN);
    if (c === 0) d.insertAdjacentHTML('beforeend', `<span class="coord r">${rk + 1}</span>`);
    if (r === 7) d.insertAdjacentHTML('beforeend', `<span class="coord f">${FILES[f]}</span>`);
    el.appendChild(d);
  }
}

/* ===================== app state ===================== */
let G = null;            // latest server state for the open game
let ws = null, wsTimer = null, wsGid = null;
let sel = null, dests = {}, pulseSq = null, revealSq = null, busy = false;
let overShown = null, pickSq = null, tickT = null, lastRecv = 0;
let cfg = { bot_username: '', miniapp: 'game' };
let lastSetup = null;    // remembers how to start "play again"

const parts = s => { const m = {}; for (const u of s.legal || []) { const f = u.slice(0, 2); (m[f] = m[f] || []).push(u); } return m; };
const myColor = () => (G && (G.role === 'w' || G.role === 'b')) ? G.role : null;
const flipped = () => G && G.role === 'b';

/* ===================== navigation ===================== */
function updateBackButton() {
  if (!tg || !tg.BackButton) return;
  if (currentView === 'home') tg.BackButton.hide(); else tg.BackButton.show();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => goBack());
function goBack() {
  if (currentView === 'review') { show('game'); if (G) renderGame(); return; }
  if (currentView === 'bots') { show('home'); return; }
  if (G && G.status === 'active' && myColor() && G.mode === 'friend') { toast('Your game continues - you can rejoin from the invite link.'); }
  leaveGame(); show('home');
}
function leaveGame() { closeModal(); if (ws) { try { ws.close(); } catch(e){} ws = null; } clearTimeout(wsTimer); wsGid = null; G = null; sel = null; dests = {}; overShown = null; clearInterval(tickT); }

/* ===================== networking ===================== */
function connectWS(gid) {
  wsGid = gid; if (ws) { try { ws.onclose = null; ws.close(); } catch(e){} }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${gid}`);
  let ping;
  ws.onopen = () => { ws.send(JSON.stringify({ init_data: initData() })); ping = setInterval(() => { try { ws.send('ping'); } catch(e){} }, 20000); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') applyState(m.state); };
  ws.onclose = () => { clearInterval(ping); if (wsGid === gid) wsTimer = setTimeout(() => connectWS(gid), 1500); };
}
async function openGame(gid, state) {
  leaveGame(); wsGid = gid;
  applyState(state); connectWS(gid);
}

/* ===================== state application ===================== */
function applyState(s) {
  const prev = (G && G.id === s.id) ? G : null;
  G = s; lastRecv = performance.now();
  if (!prev) { sel = null; dests = {}; overShown = null; pickSq = null; }
  if (prev && s.ply !== prev.ply) { sel = null; dests = {}; }
  let reveal = null;
  if (prev && s.ply > prev.ply && s.event) {
    const e = s.event;
    if (e.reveal) { snd.reveal(); hap.impact('heavy'); setTimeout(() => hap.notify('warning'), 90); reveal = e.square; revealSq = e.square; setTimeout(() => { revealSq = null; if (G && currentView === 'game') renderBoard(); }, 950); }
    else if (e.capture) { snd.capture(); hap.impact('heavy'); }
    else { snd.move(); hap.impact('light'); }
    if (e.check && !e.reveal) setTimeout(snd.check, 140);
  }
  if (prev && prev.status !== 'active' && s.status === 'active' && s.ply === 0) snd.start();
  if (s.status === 'over' && overShown !== s.id && prev && prev.status !== 'over') {
    const win = s.winner && s.winner === myColor();
    snd.over(win); hap.notify(win ? 'success' : 'warning');
  }
  if (s.status === 'waiting') { show('lobby'); renderLobby(); return; }
  if (s.status === 'cancelled') { closeModal(); toast('Invitation cancelled'); leaveGame(); show('home'); return; }
  if (currentView !== 'review') show('game');
  renderGame();
  if (currentView === 'review') return;
  handleModals();
}

/* ===================== lobby ===================== */
let lobbyT;
function inviteLink() { return `https://t.me/${cfg.bot_username}/${cfg.miniapp}?startapp=${G.id}`; }
function renderLobby() {

  clearInterval(lobbyT);
  lobbyT = setInterval(() => {
    if (!G || G.status !== 'waiting') { clearInterval(lobbyT); return; }
    const left = Math.max(0, Math.floor(G.expires - (G.server_time + (performance.now() - lastRecv) / 1000)));
    $('#lobbyInfo').textContent = `${G.tc_label} · Invitation expires in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  }, 1000);
}
$('#shareBtn').onclick = () => {

  if (tg) tg.openTelegramLink(url); else window.open(url, '_blank');
};

$('#cancelBtn').onclick = async () => { try { await api(`/api/game/${G.id}/cancel`, {}); } catch (e) { toast(e.message); } leaveGame(); show('home'); };

/* ===================== game rendering ===================== */
function panelHTML(color) {
  const p = G.players[color];
  const capturedBy = G.captured[color] || [];                       // pieces this side has captured
  const opp = color === 'w' ? 'b' : 'w';
  const order = { q: 0, r: 1, b: 2, n: 3, p: 4 };
  const sorted = [...capturedBy].sort((a, b) => order[a] - order[b]);
  const groups = {}; sorted.forEach(t => (groups[t] = groups[t] || []).push(t));
  const icons = Object.values(groups).map(g => `<span class="grp">${g.map(t => `<img src="${IMG}${opp}${t}.png" alt="">`).join('')}</span>`).join('');
  const lead = color === 'w' ? G.material_diff : -G.material_diff;
  const name = p ? esc(p.name) : 'Waiting...';
  const av = p && p.photo ? `<img class="avatar" src="${esc(p.photo)}" alt="">` : `<div class="avatar">${p ? (p.bot ? '🤖' : esc(p.name[0] || '?')) : '?'}</div>`;
  const user = p ? (p.bot ? `Stockfish · ~${p.elo} ELO` : (p.username ? '@' + esc(p.username) : '')) : '';
  return `${av}<div class="pinfo"><div class="pname">${name}</div><div class="puser">${user}</div>
    <div class="pcap">${icons}${lead > 0 ? `<span class="diff">+${lead}</span>` : ''}</div></div><div class="clock" data-c="${color}">--:--</div>`;
}
function renderGame() {
  const bottom = flipped() ? 'b' : 'w', top = bottom === 'w' ? 'b' : 'w';
  $('#pTop').innerHTML = panelHTML(top); $('#pBot').innerHTML = panelHTML(bottom);
  $('#specBadge').classList.toggle('hidden', G.role !== 'spectator');
  const player = !!myColor();
  $('#actions').classList.toggle('hidden', !player || G.status !== 'active');
  const o = $('#offerBar');
  if (player && G.status === 'active' && G.draw_offer) {
    o.classList.remove('hidden');
    if (G.draw_offer === myColor()) { o.innerHTML = `<span>Draw offer sent</span><button class="btn ghost" id="offCancel">Cancel</button>`; $('#offCancel').onclick = () => drawAct('cancel'); }
    else { o.innerHTML = `<span>Opponent offers a draw</span><span><button class="btn primary" id="offYes">Accept</button> <button class="btn ghost" id="offNo">Decline</button></span>`; $('#offYes').onclick = () => drawAct('accept'); $('#offNo').onclick = () => drawAct('decline'); }
  } else o.classList.add('hidden');
  renderBoard(); tickClocks();
  clearInterval(tickT); tickT = setInterval(tickClocks, 100);
}
function renderBoard() {
  if (!G) return;
  dests = {}; for (const [f, us] of Object.entries(parts(G))) dests[f] = new Set(us.map(u => u.slice(2, 4)));
  drawBoard($('#board'), {
    fen: G.fen, flip: flipped(), last: G.last_move ? [G.last_move.slice(0, 2), G.last_move.slice(2, 4)] : null,
    check: G.check_sq, sel, dests, secret: G.secret && G.secret.own, pulse: pulseSq, reveal: revealSq
  });
}
function fmt(ms) {
  ms = Math.max(0, ms); if (ms < 10000) return (ms / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function tickClocks() {
  if (!G) return; const el = (performance.now() - lastRecv);
  for (const c of ['w', 'b']) {
    let ms = G.clocks[c]; if (G.running === c) ms -= el;
    const n = document.querySelector(`.clock[data-c="${c}"]`); if (!n) continue;
    n.textContent = fmt(ms); n.classList.toggle('on', G.running === c); n.classList.toggle('low', ms < 10000 && G.status === 'active');
  }
}

/* ===================== interaction ===================== */
function canPlay() { return G && G.status === 'active' && myColor() && G.turn === myColor() && !busy; }
function illegalFeedback() {
  snd.error(); hap.notify('error');
  if (G && G.check_sq) { pulseSq = G.check_sq; renderBoard(); setTimeout(() => { pulseSq = null; if (G) renderBoard(); }, 1900); }
}
function sqFromXY(x, y) {
  const r = $('#board').getBoundingClientRect(); if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  let c = Math.floor((x - r.left) / r.width * 8), rw = Math.floor((y - r.top) / r.height * 8);
  const f = flipped() ? 7 - c : c, rk = flipped() ? rw : 7 - rw; return FILES[f] + (rk + 1);
}
let drag = null;
$('#board').addEventListener('pointerdown', e => {
  if (!canPlay()) return; const sq = sqFromXY(e.clientX, e.clientY); if (!sq) return;
  const pcs = parseFen(G.fen), mine = pcs[sq] && ((pcs[sq] === pcs[sq].toUpperCase()) === (myColor() === 'w'));
  if (sel && dests[sel] && dests[sel].has(sq)) { attempt(sel, sq); return; }
  if (mine) {
    const was = sel === sq; sel = sq; renderBoard();
    if (!dests[sq]) { if (G.in_check) illegalFeedback(); return; }
    drag = { sq, x: e.clientX, y: e.clientY, ghost: null, was, id: e.pointerId };
    try { $('#board').setPointerCapture(e.pointerId); } catch (err) {}
  } else {
    if (sel && G.in_check) illegalFeedback();
    sel = null; renderBoard();
  }
});
$('#board').addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    const cell = document.querySelector(`.sq[data-sq="${drag.sq}"] .pc`); if (!cell) return;
    const g = document.createElement('img'); g.src = cell.src; g.className = 'dragpc'; document.body.appendChild(g); drag.ghost = g; cell.style.opacity = .25;
  }
  if (drag.ghost) { drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
});
const endDrag = e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.ghost) {
    d.ghost.remove(); const to = sqFromXY(e.clientX, e.clientY);
    if (to && to !== d.sq) { if (dests[d.sq] && dests[d.sq].has(to)) { attempt(d.sq, to); return; } else if (G.in_check) illegalFeedback(); }
    renderBoard();
  } else if (d.was) { sel = null; renderBoard(); }
};
$('#board').addEventListener('pointerup', endDrag);
$('#board').addEventListener('pointercancel', () => { if (drag && drag.ghost) drag.ghost.remove(); drag = null; renderBoard(); });

function attempt(from, to) {
  const us = (parts(G)[from] || []).filter(u => u.slice(2, 4) === to);
  if (!us.length) { illegalFeedback(); return; }
  if (us.length > 1 || us[0].length === 5) {
    const col = myColor();
    const m = modal(`<h2>Promote to</h2><div class="promo">${['q', 'r', 'b', 'n'].map(t => `<button data-u="${from}${to}${t}"><img src="${IMG}${col}${t}.png" alt=""></button>`).join('')}</div>`);
    m.querySelectorAll('button').forEach(b => b.onclick = () => { closeModal(); sendMove(b.dataset.u); });
    return;
  }
  sendMove(us[0]);
}
async function sendMove(u) {
  busy = true;
  try { const s = await api(`/api/game/${G.id}/move`, { move: u }); applyState(s); }
  catch (e) { illegalFeedback(); if (e.status !== 422) toast(e.message); sel = null; renderBoard(); }
  finally { busy = false; }
}

/* ===================== modals: secret queen + game over ===================== */
function handleModals() {
  const m = $('#modal'), kind = m.dataset.kind;
  if (G.status === 'setup') { renderSecretModal(); return; }
  if (G.status === 'over') {
    if (overShown !== G.id) { overShown = G.id; setTimeout(() => { if (G && G.status === 'over' && currentView === 'game') renderOverModal(); }, 500); }
    else if (kind === 'over' && !m.classList.contains('hidden')) renderOverModal();
    return;
  }
  if (kind === 'secret') closeModal();
}
function renderSecretModal() {
  const col = myColor();
  if (!col) { modal(`<h2>Players are choosing</h2><p class="sub">The game starts when both players have picked a secret queen.</p>`, 'secret'); return; }
  if (G.secret.picked[col]) { modal(`<h2>Secret queen locked in</h2><p class="sub">Waiting for your opponent to pick...</p>`, 'secret'); return; }
  const m = modal(`<h2>Pick a pawn to be your secret queen</h2>
    <p class="sub" style="margin:0">Your opponent will never see which one. Move it like a pawn to stay hidden; break the pawn rules and it becomes a queen.</p>
    <div class="pawns">${FILES.split('').map(f => `<button class="pawnbtn ${pickSq === f ? 'on' : ''}" data-f="${f}"><img src="${IMG}${col}p.png" alt=""><i>${f}</i></button>`).join('')}</div>
    <button class="btn violet wide" id="lockBtn" ${pickSq ? '' : 'disabled'}>Lock in pick</button>`, 'secret');
  m.querySelectorAll('.pawnbtn').forEach(b => b.onclick = () => { pickSq = b.dataset.f; hap.impact('light'); renderSecretModal(); });
  $('#lockBtn').onclick = async () => {
    try { applyState(await api(`/api/game/${G.id}/secret_pick`, { square: pickSq + (col === 'w' ? '2' : '7') })); hap.notify('success'); } catch (e) { toast(e.message); }
  };
}
function renderOverModal() {
  if (!G || G.status !== 'over') return;
  const col = myColor(), win = G.winner && G.winner === col, loss = G.winner && col && G.winner !== col;
  const headline = !col ? 'Game over' : win ? 'You won' : loss ? 'You lost' : 'Draw';
  const secret = G.variant === 'secret_queen';
  const primary = secret || !G.review_available ? (col ? `<button class="btn primary wide" id="againBtn">Play Again 🔄</button>` : '')
                                                  : `<button class="btn primary wide" id="reviewBtn">Game Review 🔍</button>`;
  const rematchLbl = G.rematch_id ? 'Accept Rematch ✅' : 'Rematch 🔄';
  modal(`<div class="banner ${win ? 'win' : loss ? 'loss' : ''}">${headline}</div><p class="sub" style="margin:0 0 4px">${esc(G.banner)}</p>
    ${primary}<div class="row"><button class="btn" id="shareGame">Share 📤</button>${col ? `<button class="btn" id="rematchBtn">${rematchLbl}</button>` : ''}</div>
    <button class="btn ghost wide" id="homeBtn">Back to menu</button>`, 'over');
  if ($('#reviewBtn')) $('#reviewBtn').onclick = () => { closeModal(); openReview(); };
  if ($('#againBtn')) $('#againBtn').onclick = playAgain;
  $('#shareGame').onclick = sharePGN;
  if ($('#rematchBtn')) $('#rematchBtn').onclick = rematch;
  $('#homeBtn').onclick = () => { leaveGame(); show('home'); };
}
function sharePGN() {
  const pgn = G.pgn;
  const m = modal(`<h2>Share this game</h2><textarea readonly id="pgnText">${esc(pgn)}</textarea>
    <div class="row"><button class="btn" id="cpPgn">Copy PGN</button><button class="btn primary" id="sendPgn">Send in Telegram</button></div>
    <button class="btn ghost wide" id="pgnBack">Close</button>`);

  $('#sendPgn').onclick = () => { const u = 'https://t.me/share/url?url=' + encodeURIComponent('Chess game: ' + G.banner) + '&text=' + encodeURIComponent(pgn); tg ? tg.openTelegramLink(u) : window.open(u, '_blank'); };
  $('#pgnBack').onclick = renderOverModal;
}
async function rematch() {
  try { const r = await api(`/api/game/${G.id}/rematch`, {}); await openGame(r.game_id, r.state); }
  catch (e) { toast(e.message); }
}

}

/* ===================== review ===================== */
const CLS = {
  brilliant: ['!!', '#26c2a3', 'Brilliant'], great: ['!', '#5b8bb9', 'Great'], best: ['★', '#7fb069', 'Best'],
  excellent: ['✓', '#96bc4b', 'Excellent'], good: ['•', '#a7b8a1', 'Good'], book: ['📖', '#b08a64', 'Book'],
  inaccuracy: ['?!', '#f7c631', 'Inaccuracy'], mistake: ['?', '#e58f2a', 'Mistake'], miss: ['!?', '#ff7769', 'Miss'], blunder: ['??', '#ca3431', 'Blunder']
};
let RV = null, rvIdx = 0;
async function openReview() {
  show('review');
  const box = $('#review'); box.innerHTML = `<div class="loader"><div class="spin"></div>Analyzing with Stockfish...<br><small>First run takes a little while; results are cached for a day.</small></div>`;
  try { RV = await api(`/api/game_review/${G.id}`, null, 'GET', { 'X-Init-Data': initData() }); rvIdx = RV.moves.length; renderReview(); }
  catch (e) {
    let msg = e.message;
    if (e.status === 429 && e.detail && e.detail.reset_at) {
      const s = Math.max(0, Math.round(e.detail.reset_at - Date.now() / 1000));
      msg = `You've used your game review for today. It resets at 00:00, in ${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m.`;
    }
    box.innerHTML = `<div class="loader">${esc(msg)}<br><br><button class="btn" id="rvBack">Back</button></div>`; $('#rvBack').onclick = () => { show('game'); renderGame(); handleModals(); }; }
}
function renderReview() {
  const box = $('#review'), R = RV, nm = c => esc(R.players[c] ? R.players[c].name : c);
  const perf = c => ['opening', 'middlegame', 'endgame'].map(p => `${p[0].toUpperCase() + p.slice(1)} ${R.performance[c][p] ?? '-'}`).join('<br>');
  box.innerHTML = `
  <div class="rvtop"><button class="back" id="rvBack">‹ Back</button><span style="color:var(--muted);font-size:14px">${esc(R.banner || '')}</span></div>
  <div class="acc"><div><span>${nm('w')} · CAPS</span><b>${R.accuracy.w ?? '-'}</b><small>${perf('w')}</small></div><div><span>${nm('b')} · CAPS</span><b>${R.accuracy.b ?? '-'}</b><small>${perf('b')}</small></div></div>
  <div class="graph" id="graph"></div>
  <div class="boardwrap rvboard"><div class="board" id="rvBoard"></div></div>
  <div class="cur" id="cur"></div>
  <div class="nav"><button class="btn" id="rvStart">⏮</button><button class="btn" id="rvPrev">◀</button><button class="btn" id="rvNext">▶</button><button class="btn" id="rvEnd">⏭</button></div>
  <div class="moves" id="mvList"></div>`;
  $('#rvBack').onclick = () => { show('game'); renderGame(); handleModals(); };
  $('#rvStart').onclick = () => setIdx(0); $('#rvPrev').onclick = () => setIdx(rvIdx - 1); $('#rvNext').onclick = () => setIdx(rvIdx + 1); $('#rvEnd').onclick = () => setIdx(R.moves.length);
  $('#mvList').innerHTML = R.moves.map((m, i) => `<button class="chip" data-i="${i + 1}">${m.color === 'w' ? Math.ceil((i + 1) / 2) + '.' : ''}${esc(m.san)}<span class="badge" style="background:${CLS[m.cls][1]}">${CLS[m.cls][0]}</span></button>`).join('');
  $('#mvList').querySelectorAll('.chip').forEach(c => c.onclick = () => setIdx(+c.dataset.i));
  const gr = $('#graph'), scrub = e => { const r = gr.getBoundingClientRect(); setIdx(Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * R.moves.length)); };
  let down = false; gr.onpointerdown = e => { down = true; scrub(e); }; gr.onpointermove = e => { if (down) scrub(e); }; gr.onpointerup = () => down = false; gr.onpointerleave = () => down = false;
  setIdx(rvIdx);
}
function setIdx(i) {
  const R = RV; rvIdx = Math.max(0, Math.min(R.moves.length, i));
  const m = rvIdx ? R.moves[rvIdx - 1] : null;
  drawBoard($('#rvBoard'), { fen: R.fens[rvIdx], flip: false, last: m ? [m.uci.slice(0, 2), m.uci.slice(2, 4)] : null });
  $('#cur').innerHTML = m ? `<span class="badge" style="background:${CLS[m.cls][1]}">${CLS[m.cls][0]}</span><b>${esc(m.san)} is ${CLS[m.cls][2].toLowerCase()}</b>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">${m.cls !== 'best' && m.cls !== 'brilliant' && m.cls !== 'great' && m.best_san ? `Engine prefers ${esc(m.best_san)} · ` : ''}Eval ${m.eval > 0 ? '+' : ''}${(Math.abs(m.eval) >= 1000 ? (m.eval > 0 ? 'M' : '-M') : (m.eval / 100).toFixed(1))}</div>`
    : `<b>Start position</b><div style="color:var(--muted);font-size:13px;margin-top:4px">Tap the graph or use the arrows to step through the game.</div>`;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.i === rvIdx));
  const cur = document.querySelector('.chip.on'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  drawGraph();
}
function drawGraph() {
  const R = RV, n = R.evals.length - 1 || 1, W = 300, Hh = 84, y = v => Hh / 2 - (Math.max(-800, Math.min(800, v)) / 800) * (Hh / 2 - 4);
  const pts = R.evals.map((v, i) => `${(i / n * W).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const x = rvIdx / n * W;
  $('#graph').innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><rect width="${W}" height="${Hh}" fill="#26363c"/>
    <polygon points="0,${Hh} ${pts} ${W},${Hh}" fill="#e8f0ec"/><line x1="0" x2="${W}" y1="${Hh / 2}" y2="${Hh / 2}" stroke="#e2b354" stroke-width=".6" stroke-dasharray="3 3"/>
    <line x1="${x}" x2="${x}" y1="0" y2="${Hh}" stroke="#e2b354" stroke-width="1.6"/></svg>`;
}

/* ===================== boot ===================== */
async function boot() {
  try { cfg = await api('/api/config', null, 'GET'); } catch (e) {}
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param || new URLSearchParams(location.search).get('startapp');
  const mode = new URLSearchParams(location.search).get('mode');
  if (sp) {
    try { const r = await api(`/api/game/${sp}/join`, {}); await openGame(r.game_id, r.state); return; }
    catch (e) { toast(e.status === 410 ? 'This invitation is no longer valid.' : e.message); }
  }
  show('home');
  if (mode === 'bot') openBots(); else if (mode && mode !== 'null') startFriend(mode);
}
boot();
</script>
</body>
</html>
